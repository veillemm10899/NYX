<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060411" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NYX — The Cosmic River</title>

    <link rel="icon" type="image/webp" href="developer/logo.webp" />
    <link rel="apple-touch-icon" href="developer/logo.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="splash">
        <canvas id="stars"></canvas>
        <canvas id="nebula"></canvas>

        <div class="splash-card">
            <div class="brand-mark">
                <i class="moon-symbol"></i>
            </div>
            <h1 class="brand-name">NYX</h1>
            <p class="brand-tag">The Cosmic River</p>
            <p class="brand-sub">A quiet place to talk, under the same sky.</p>

            <button id="enter-nyx" class="enter-btn">
                <span>Enter</span>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>

            <a href="login.html" class="enter-link" tabindex="-1">Log in now</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
