<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>NYX — The Flight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="fly.css" />
</head>
<body>
    <!-- THE FLIGHT: one-tap, score-based. The river remembers the score when you crash. -->

    <main id="shell" class="shell">
        <canvas id="game-canvas"></canvas>

        <header class="top-bar">
            <div class="brand">
                <i class="fas fa-moon"></i>
                <div class="brand-text">
                    <span class="brand-title">THE FLIGHT</span>
                    <span class="brand-sub">glide the river</span>
                </div>
            </div>
            <div class="top-actions">
                <button id="mute-btn" class="top-btn" title="Sound">
                    <i class="fas fa-volume-high"></i>
                </button>
                <a href="chat.html" class="top-btn top-link" title="Back to The River">
                    <i class="fas fa-water"></i>
                </a>
            </div>
        </header>

        <div id="toast" class="toast"></div>
    </main>

    <!-- Game over overlay -->
    <div id="gameover" class="gameover hidden">
        <div class="gameover-card">
            <div class="go-glyph"><i class="fas fa-moon"></i></div>
            <h1 class="go-title">THE RIVER CLAIMS YOU</h1>
            <p class="go-sub">But it will remember the score of your fall.</p>
            <ul class="go-stats">
                <li><span>Gates swept</span><b id="go-gates">0</b></li>
                <li><span>Score</span><b class="go-score" id="go-score">0</b></li>
                <li><span>Best</span><b id="go-best">0</b></li>
            </ul>
            <div class="hall" id="hall" hidden>
                <div class="hall-title"><i class="fas fa-crown"></i> RIVER HALL OF FAME</div>
                <ol class="hall-list" id="hall-list"></ol>
            </div>
            <div class="go-actions">
                <button id="broadcast-btn" class="go-btn go-broadcast">
                    <i class="fas fa-water"></i>
                    <span>Shout it to The River</span>
                </button>
                <button id="restart-btn" class="go-btn go-restart">
                    <i class="fas fa-rotate-left"></i>
                    <span>Rise Again</span>
                </button>
            </div>
            <a href="chat.html" class="go-back">Back to The River</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="flight.js"></script>
</body>
</html>
