<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#060411" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NYX - Private Chat</title>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="developer/logo.webp" />
    <link rel="apple-touch-icon" href="developer/logo.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="chat.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Desktop Layout -->
    <div id="desktop-layout" class="layout-container">
        <!-- Left Sidebar - Online Users -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="nyx-logo">
                    <i class="fas fa-moon"></i>
                    <span>NYX</span>
                </div>
                <div class="online-count">
                    <span id="online-count">0</span>
                    <span>Online</span>
                </div>
            </div>
            
            <div class="online-users-container">
                <div class="section-title">Online Nyx</div>
                <div id="online-users" class="online-users">
                    <!-- Online users will be populated here -->
                </div>
            </div>
            
            <div class="sidebar-footer">
                <button id="back-to-public-sidebar-btn" class="developer-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Public</span>
                </button>
                <button id="developer-btn" class="developer-btn">
                    <i class="fas fa-code"></i>
                    <span>Developer</span>
                </button>
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Leave River</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Private Chat Header -->
            <div class="private-chat-header">
                <button id="back-to-public-btn" class="back-to-public-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Public</span>
                </button>
                <div class="chat-partner-info">
                    <div class="partner-avatar" id="partner-avatar">?</div>
                    <div class="partner-details">
                        <div class="partner-name" id="partner-name">User</div>
                        <div class="partner-status" id="partner-status">Online</div>
                    </div>
                </div>
            </div>
            
            <div class="chat-container">
                <div id="messages" class="messages">
                    <!-- Messages will be populated here -->
                </div>
            </div>
            
            <div class="message-input-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="message-input" 
                        class="message-input" 
                        placeholder="Send private message..."
                        maxlength="500"
                        autocomplete="off"
                        inputmode="text"
                        spellcheck="false"
                        autocorrect="off"
                        autocapitalize="off"
                    />
                    <button id="send-btn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-info">
                    <span id="char-count">0/500</span>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Mobile Layout -->
    <div id="mobile-layout" class="layout-container mobile-hidden">
        <!-- Mobile Drawer -->
        <div id="mobile-drawer" class="mobile-drawer">
            <div class="drawer-header">
                <div class="nyx-logo">
                    <i class="fas fa-moon"></i>
                    <span>NYX</span>
                </div>
                <button id="close-drawer" class="close-drawer">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="drawer-content">
                <div class="online-count">
                    <span id="mobile-online-count">0</span>
                    <span>Online</span>
                </div>
                
                <div class="section-title">Online Nyx</div>
                <div id="mobile-online-users" class="online-users">
                    <!-- Online users will be populated here -->
                </div>
                
                <div class="drawer-actions">
                    <button id="mobile-back-to-public-sidebar-btn" class="developer-btn">
                        <i class="fas fa-arrow-left"></i>
                        <span>Back to Public</span>
                    </button>
                    <button id="mobile-developer-btn" class="developer-btn">
                        <i class="fas fa-code"></i>
                        <span>Developer</span>
                    </button>
                    <button id="mobile-logout-btn" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Leave River</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Chat -->
        <div class="mobile-chat">
            <div class="mobile-chat-header">
                <button id="open-drawer" class="menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="chat-partner-info">
                    <div class="partner-avatar" id="mobile-partner-avatar">?</div>
                    <div class="partner-details">
                        <div class="partner-name" id="mobile-partner-name">User</div>
                        <div class="partner-status" id="mobile-partner-status">Online</div>
                    </div>
                </div>
                <button id="mobile-back-to-public-btn" class="back-to-public-btn">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
            
            <div class="chat-container">
                <div id="mobile-messages" class="messages">
                    <!-- Messages will be synced with desktop messages -->
                </div>
            </div>
            
            <div class="message-input-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="mobile-message-input" 
                        class="message-input" 
                        placeholder="Send private message..."
                        maxlength="500"
                        autocomplete="off"
                        inputmode="text"
                        spellcheck="false"
                        autocorrect="off"
                        autocapitalize="off"
                    />
                    <button id="mobile-send-btn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-info">
                    <span id="mobile-char-count">0/500</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Profiles Modal -->
    <div id="profiles-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Choose Nyx for Private Chat</h2>
                <button id="close-profiles-modal" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="profiles-list" class="profiles-list">
                    <!-- Profiles will be populated here -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scroll to bottom -->
    <button id="scroll-bottom" class="scroll-bottom-btn" aria-label="Scroll to bottom">
        <i class="fas fa-arrow-down"></i>
    </button>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading profiles...</div>
    </div>
    
    <script src="supabase-config.js"></script>
    <script src="simple_online_status.js"></script>
    <script src="private_chat.js"></script>
</body>
</html>
