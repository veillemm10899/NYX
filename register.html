<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060411" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NYX — Create Account</title>

    <link rel="icon" type="image/webp" href="developer/logo.webp" />
    <link rel="apple-touch-icon" href="developer/logo.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="space-dust"></div>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-head">
                <div class="brand-mark"><div class="moon-symbol"></div></div>
                <h1 class="auth-title">NYX</h1>
                <div class="auth-sub">Create account</div>
            </div>

            <form id="register-form" class="auth-form" novalidate>
                <div class="field">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" placeholder="Your name" autocomplete="name" required />
                </div>

                <div class="field">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="you@example.com" autocomplete="email" required />
                </div>

                <div class="field">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="At least 6 characters" autocomplete="new-password" required />
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat password" autocomplete="new-password" required />
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <div class="form-links">
                    <a href="login.html" class="nyx-link">Already have an account? Log in</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="register-loading" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <div class="loading-text">Creating your account...</div>
        <div class="loading-details">Assigning your Nyx name</div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="register.js"></script>
</body>
</html>
