<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060411" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NYX - Choose Chat Partner</title>

    <link rel="icon" type="image/webp" href="developer/logo.webp" />
    <link rel="apple-touch-icon" href="developer/logo.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="chat.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Back Button -->
    <a href="chat.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Chat</span>
    </a>

    <!-- Users Container -->
    <div class="users-container">
        <div class="users-header">
            <h1>Choose Nyx to Chat</h1>
            <p>Select someone to start a private conversation</p>
        </div>

        <div id="users-grid" class="users-grid">
            <!-- Users will be populated here -->
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading users...</div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="users_page.js"></script>
</body>
</html>
